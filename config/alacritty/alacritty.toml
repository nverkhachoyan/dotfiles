[general]
# Keep a complete static theme in the repository. macOS appearance changes
# are applied at runtime by alacritty-theme-switcher.sh.
import = [
    "~/.config/alacritty/themes/codex-noir.toml"
]

[bell]
duration = 0

[cursor]
blink_interval = 450
thickness = 0.18
# unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Block"

[font]
size = 16.0

[font.normal]
family = "DroidSansM Nerd Font"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control|Shift"

[[keyboard.bindings]]
chars = "\n"
key = "Enter"
mods = "Shift"

[mouse]
hide_when_typing = true

[scrolling]
history = 50000
multiplier = 4

[selection]
save_to_clipboard = true

[terminal]
osc52 = "CopyPaste"

[window]
blur = false
dynamic_padding = true
dynamic_title = true
opacity = 1.0
option_as_alt = "Both"
startup_mode = "Maximized"

[window.padding]
x = 10
y = 10
