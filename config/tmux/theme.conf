# Theme: macOS Dark (SF Palette; matches config/ghostty/theme.conf)
set -g status-position top
set -g status-interval 5
# Let Ghostty's background and opacity carry through the status bar.
set -g status-style "bg=default,fg=#f5f5f7"
set -g status-left "#[fg=#0a84ff,bold] #S #[fg=#636366]│"
set -g status-left-length 28
set -g status-right "#[fg=#636366]│ #[fg=#8e8e93]%H:%M "
set -g status-right-length 16
set -g window-status-format "#[fg=#636366] #I:#W "
set -g window-status-current-format "#[fg=#1e1e1e,bg=#0a84ff,bold] #I:#W "
set -g window-status-separator " "
set -g pane-border-style "fg=#3a3a3c"
set -g pane-active-border-style "fg=#64d2ff"
set -g display-panes-colour "#636366"
set -g display-panes-active-colour "#007aff"
set -g message-style "bg=#2c2c2e,fg=#f5f5f7"
set -g message-command-style "bg=#2c2c2e,fg=#64d2ff"
set -g mode-style "bg=#0058d0,fg=#ffffff"

setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#ffd60a"
