set -g default-terminal "tmux-256color"
set -g base-index 1
setw -g pane-base-index 1
set -g status-keys vi
set -g mode-keys vi

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
setw -g aggressive-resize off
set -s escape-time 0
set -g history-limit 50000
set -g renumber-windows on
set -g set-titles off
set -ag terminal-overrides ",alacritty:RGB,xterm-256color:RGB,tmux-256color:RGB"
set -as terminal-features ",alacritty:RGB"
set -g focus-events on

bind -n C-M-l send-keys 'clear' C-m

bind-key -T copy-mode-vi / command-prompt -i -p "search down" \
  "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up" \
  "send -X search-backward-incremental \"%%%\""
bind-key -T copy-mode-vi v send -X begin-selection
if-shell 'command -v pbcopy >/dev/null 2>&1' {
  bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
} {
  bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
}

bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key z resize-pane -Z
bind-key b break-pane -d
bind-key X kill-pane

is_vim="ps -o comm= -t '#{pane_tty}' | grep -iqE 'g?(view|n?vim)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
# Keep Ctrl-L available to shells/editors for clear-screen/redraw.
unbind-key -nq C-l

# Clear the screen with Prefix + l
# bind l send-keys 'C-l'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "resize-pane -L 5"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "resize-pane -D 5"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "resize-pane -U 5"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "resize-pane -R 5"

bind-key -T copy-mode-vi M-h resize-pane -L 5
bind-key -T copy-mode-vi M-j resize-pane -D 5
bind-key -T copy-mode-vi M-k resize-pane -U 5
bind-key -T copy-mode-vi M-l resize-pane -R 5

bind-key -n M-H swap-pane -s '{left-of}'
bind-key -n M-L swap-pane -s '{right-of}'
bind-key -n M-K swap-pane -s '{up-of}'
bind-key -n M-J swap-pane -s '{down-of}'

bind-key < swap-window -t -1 \; previous-window
bind-key > swap-window -t +1 \; next-window

unbind-key w
bind-key w choose-tree -Zs
bind-key C-j choose-tree

bind-key f run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list --icons -t)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list --icons -c)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list --icons -z)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}' \
    -- --ansi
)\""

set -g status-position top
set -g status-interval 5
set -g status-style "bg=#080a0d,fg=#8d96a3"
set -g status-left "#[fg=#7dd3fc,bold] #S #[fg=#2a3441]│"
set -g status-left-length 28
set -g status-right "#[fg=#2a3441]│ #[fg=#8d96a3]%H:%M "
set -g status-right-length 16
set -g window-status-format "#[fg=#5c6370] #I:#W "
set -g window-status-current-format "#[fg=#080a0d,bg=#7dd3fc,bold] #I:#W "
set -g window-status-separator " "
set -g pane-border-style "fg=#1d2633"
set -g pane-active-border-style "fg=#56b6c2"
set -g display-panes-colour "#5c6370"
set -g display-panes-active-colour "#7dd3fc"
set -g message-style "bg=#11151c,fg=#d7dce2"
set -g message-command-style "bg=#11151c,fg=#7dd3fc"
set -g mode-style "bg=#243244,fg=#f2f5f8"

setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#e5b07d"

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

run-shell -b "$HOME/.config/alacritty/alacritty-theme-switcher.sh >/dev/null 2>&1 || true"

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
