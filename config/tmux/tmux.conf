source-file ~/.config/tmux/keybindings.conf
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/theme.conf

if-shell '[ "$(uname -s 2>/dev/null)" = Darwin ] && [ -x "$HOME/.config/alacritty/alacritty-theme-switcher.sh" ]' \
  'run-shell -b "$HOME/.config/alacritty/alacritty-theme-switcher.sh >/dev/null 2>&1 || true"'

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
