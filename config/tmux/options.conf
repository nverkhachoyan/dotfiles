set -g default-terminal "tmux-256color"
# Keep Ghostty and Alacritty truecolor support when tmux is nested inside them.
set -ag terminal-overrides ",alacritty:RGB,xterm-ghostty:RGB,xterm-256color:RGB,tmux-256color:RGB"
set -as terminal-features ",alacritty:RGB,xterm-ghostty:RGB"
set -g base-index 1
set -g status-keys vi
set -g mode-keys vi
set -g mouse on
set -s escape-time 0
set -g history-limit 50000
set -g renumber-windows on
set -g set-titles off
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u

setw -g pane-base-index 1
setw -g aggressive-resize off
