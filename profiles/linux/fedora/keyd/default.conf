[ids]
*

[main]
leftmeta = layer(meta_mac)
rightmeta = layer(meta_mac)

# Super acts as Ctrl for every key not overridden below (Cmd+C/V/X/T/W/L/1-9...)
[meta_mac:C]
space = A-space
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home delete)
# Cmd+Tab: tap Alt+Tab, then hold Alt (via app_switch_state) so repeated
# Tab keeps cycling and releasing Super confirms the choice.
tab = swapm(app_switch_state, A-tab)
# Cmd+`: cycle windows of the current app (KDE default Alt+`)
` = A-`

[app_switch_state:A]
tab = A-tab
right = A-tab
` = A-S-tab
left = A-S-tab
